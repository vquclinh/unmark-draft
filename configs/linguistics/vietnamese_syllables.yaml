# Upstream description, verbatim from the gist metadata:
#   "All possibly existent Vietnamese syllables, created by combine all onsets
#    with all rimes. More information can be found at:
#    http://hieuthi.com/blog/2017/03/21/all-vietnamese-syllables.html"
#
# This is the STRUCTURAL enumeration (every onset x every rime), which is what
# proposal 4.3 asks for. The author's separate ~7,184-entry COMMON/frequency
# list is deliberately NOT used: a frequency list answers "which syllables occur
# often", not "which syllables are legal".
upstream_description: >-
  All possibly existent Vietnamese syllables, created by combine all onsets with
  all rimes.

# --- License ---------------------------------------------------------------
# Checked on the gist metadata and file listing: no LICENSE file, no license
# field, no license statement in the description. A public gist is not a licence.
license_status: NO_EXPLICIT_LICENSE
license_notes: >-
  No license statement was found on the gist (no LICENSE file, no license field,
  no statement in the description). Redistribution permission is therefore NOT
  established, so this repository does not vendor the raw file. It is fetched
  into a git-ignored repo-local cache and verified by checksum. Only provenance
