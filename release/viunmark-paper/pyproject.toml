[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viunmark"
version = "0.1.0"
description = "Publication code for ViUnMark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
torch = ["torch"]
test = ["pytest"]
notebook = ["nbformat"]

[project.scripts]
viunmark = "viunmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
